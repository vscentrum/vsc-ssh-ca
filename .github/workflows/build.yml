---
name: Build RPM

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest

    container:
      image: rockylinux:9

    steps:
      - name: Install build dependencies
        run: |
          dnf -y update
          dnf -y install \
            rpm-build \
            rpmdevtools \
            python3 \
            python3-pip \
            findutils

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build RPM
        run: ./bdist_rpm.sh

      - name: Verify RPMs exist
        run: |
          find dist -type f -name "*.rpm"
          test -n "$(find dist -type f -name '*.rpm' -print -quit)"

      - name: Install generated RPMs
        run: |
          dnf -y install dist/*.rpm

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rpms
          path: dist/*.rpm
